services:
  notebook:
    image: celiib/neurd:v1
    build:
      context: .
    env_file:
      - path: .env
        required: false
    environment:
      - DISPLAY=$DISPLAY
      - XSOCK=/tmp/.X11-unix/X0
    ports:
      - "8890:8888"
    volumes:
      - ./notebooks:/notebooks
      - ../Applications:/Applications
      #- ../examples:/examples
      #- /mnt:/mnt

  test:
    image: celiib/neurd:v1
    build:
      context: .
    working_dir: /NEURD
    volumes:
      - ../:/NEURD
    entrypoint: ["/bin/bash", "-c"]
    command: ["pip install -q --no-deps -e . && pytest tests/unit/ -v"]

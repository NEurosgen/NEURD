name: tests

on:
  push:
    branches: [main, 'refactor/**']
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unit gate (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10-3.12 only: 3.13+ has no open3d wheel (see scripts/install_local.sh).
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system libs
        run: |
          sudo apt-get update -qq
          # libgl1/libegl1: open3d + trimesh import them even headless.
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libgomp1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # mesh_processing_tools is pure-Python but pins open3d==0.11.2 in its
          # metadata; --no-deps lets us keep modern open3d. Mirrors
          # scripts/install_local.sh, which is the documented local install.
          pip install --no-deps mesh_processing_tools==1.0.4
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Import shims activate
        # neurd/__init__.py installs the numpy-2 / meshlab / perf patches at import time.
        # Importing succeeds even when a patch fails (each is behind try/except by design),
        # so check the registry too -- a missing dependency of the --no-deps
        # mesh_processing_tools install shows up here as a failed patch, which is far easier
        # to read than the pytest collection errors it causes downstream.
        run: |
          python - <<'PY'
          import sys, neurd
          for name, ok in sorted(neurd.PATCH_STATUS.items()):
              print(f"  {str(ok):<6} {name}")
          failed = sorted(k for k, v in neurd.PATCH_STATUS.items() if v is False)
          if failed:
              sys.exit(f"perf/compat patches failed to install: {failed}")
          print("neurd import OK, all patches installed")
          PY

      - name: mesh_tools imports
        # Four unit tests import `from mesh_tools import trimesh_utils` at module level,
        # which pulls in every one of ITS module-level deps -- and mesh_processing_tools is
        # installed --no-deps, so a gap there surfaces as an opaque collection error. Fail
        # loudly here instead, naming the module.
        #
        # `import neurd` MUST come first: it installs the numpy-2 shim for
        # datasci_tools.numpy_dep, without which trimesh_utils dies on `np.float_`.
        run: |
          python -c "
          import neurd  # noqa: F401  -- installs the numpy-2 shim first
          from mesh_tools import trimesh_utils, skeleton_utils
          print('mesh_tools OK')
          "

      - name: Unit gate
        # pytest.ini scopes testpaths to tests/unit. The integration test needs
        # xvfb + meshlabserver and is intentionally not run here.
        run: pytest -q
